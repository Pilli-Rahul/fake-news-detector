<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fake News Detector</title>
  <style>{% include "style.css" %}</style>
</head>
<body>
  <section class="app-shell">
    <header class="top-row">
      <div class="brand">Fake OR Real</div>
      <div class="accuracy-badge">Model accuracy: {{ accuracy }}</div>
    </header>

    <main>
      <div class="hero">
        <h1>Detect <em>Fake News</em> with AI</h1>
        <p>Paste any news article or headline below. The model will classify it as Real or Fake.</p>
      </div>

      <label for="newsInput">Paste news article or headline</label>
      <textarea
        id="newsInput"
        placeholder="e.g. Scientists discover a new species of fish in the Amazon river that can breathe air..."
      ></textarea>
      <div class="char-count"><span id="charCount">0</span> characters</div>

      <div class="btn-row">
        <button class="btn-primary" id="predictBtn" onclick="predict()">Analyze Article</button>
        <button class="btn-clear" onclick="clearAll()">Clear</button>
      </div>

      <div class="result-box" id="resultBox">
        <div class="result-label" id="resultLabel"></div>
        <div class="result-confidence" id="resultConfidence"></div>
        <div class="prob-row">
          <div class="prob-item">
            <span class="prob-label">Fake</span>
            <div class="bar-track"><div class="bar-fill fake" id="fakeBar"></div></div>
            <span class="prob-pct" id="fakeProb">0%</span>
          </div>
          <div class="prob-item">
            <span class="prob-label">Real</span>
            <div class="bar-track"><div class="bar-fill real" id="realBar"></div></div>
            <span class="prob-pct" id="realProb">0%</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="footnote">Built with Python, Flask, and Scikit-learn</footer>
  </section>

  <script>
    const textarea   = document.getElementById("newsInput");
    const charCount  = document.getElementById("charCount");
    const predictBtn = document.getElementById("predictBtn");
    const resultBox  = document.getElementById("resultBox");

    textarea.addEventListener("input", () => {
      charCount.textContent = textarea.value.length;
    });

    async function predict() {
      const text = textarea.value.trim();
      if (!text) { alert("Please paste a news article first."); return; }

      predictBtn.disabled = true;
      predictBtn.innerHTML = '<span class="spinner"></span> Analyzing...';
      resultBox.style.display = "none";

      try {
        const res  = await fetch("/predict", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ text })
        });

        const data = await res.json();

        if (data.error) {
          showError(data.error);
          return;
        }

        showResult(data);
      } catch (err) {
        showError("Could not connect to the server. Make sure Flask is running.");
      } finally {
        predictBtn.disabled = false;
        predictBtn.innerHTML = "Analyze Article";
      }
    }

    function showResult(data) {
      const isFake = data.label === 0;

      resultBox.className  = "result-box " + (isFake ? "fake" : "real");
      resultBox.style.display = "block";

      document.getElementById("resultLabel").textContent =
        isFake ? "Fake News" : "Real News";

      document.getElementById("resultConfidence").textContent =
        `Confidence: ${data.confidence}%`;

      document.getElementById("fakeBar").style.width  = data.fake_prob + "%";
      document.getElementById("realBar").style.width  = data.real_prob + "%";
      document.getElementById("fakeProb").textContent = data.fake_prob + "%";
      document.getElementById("realProb").textContent = data.real_prob + "%";
    }

    function showError(msg) {
      resultBox.className = "result-box error";
      resultBox.style.display = "block";
      document.getElementById("resultLabel").textContent = "Error";
      document.getElementById("resultConfidence").textContent = msg;
      document.getElementById("fakeBar").style.width = "0%";
      document.getElementById("realBar").style.width = "0%";
      document.getElementById("fakeProb").textContent = "-";
      document.getElementById("realProb").textContent = "-";
    }

    function clearAll() {
      textarea.value = "";
      charCount.textContent = "0";
      resultBox.style.display = "none";
    }
  </script>
</body>
</html>
